<app-entity-dialog [(open)]="open" [title]="initial ? 'Editar año lectivo' : 'Nuevo año lectivo'" [schema]="schema"
  [initial]="initial" [submitFn]="submitFn" (closed)="onClosed($event)">
  <div class="mt-3" *ngIf="initial?.id">
    <button type="button" class="btn btn-secondary btn-sm me-2" (click)="togglePeriodos()">Periodos</button>
    <div *ngIf="showPeriodos && initial?.id" class="mt-3">
      <app-periodo-list [anioId]="initial?.id"></app-periodo-list>
    </div>
  </div>

</app-entity-dialog>
