<div class="p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Año lectivo</h3>
    <div>
      <button class="btn btn-primary btn-sm" (click)="openNew()">Nuevo año lectivo</button>
    </div>
  </div>

  <div *ngIf="loading">Cargando...</div>
  <app-data-table *ngIf="!loading" [items]="items()" [columns]="columns" [newLabel]="'Nuevo año lectivo'"
    (create)="openNew()" (edit)="openEdit($event)" (toggleActive)="toggleActive($event)">
  </app-data-table>

  <app-anio-lectivo-form [open]="modalOpen()" [initial]="editing()" (openChange)="modalOpen.set($event)"
    (saved)="onSaved()" (closed)="modalOpen.set(false)">
  </app-anio-lectivo-form>
</div>
